<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 260px;
      padding: 20px;
      text-align: center;
      margin: 0;
      background-color: #202124;
      color: #e8eaed;
    }
    h3 {
      margin-top: 0;
      color: #e8eaed;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.25px;
    }
    button {
      background-color: #8ab4f8;
      color: #202124;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      margin-top: 15px;
      width: 100%;
      transition: background-color 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #aecbfa;
    }
    button:disabled {
      background-color: #3c4043;
      color: #80868b;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 13px;
      color: #9aa0a6;
      word-wrap: break-word;
      min-height: 20px;
    }
    .error { color: #f28b82 !important; font-weight: 500; }
    .success { color: #81c995 !important; font-weight: 500; }
  </style>
</head>
<body>
  <h3>Template Copier</h3>
  <div id="status">Checking current folder...</div>
  <button id="copyBtn" disabled>Copy Template Here</button>
  <script src="popup.js"></script>
</body>
</html>
